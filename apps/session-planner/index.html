<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Session Planner</title>
<style>
/* Same design tokens and components as Coach Tools (web/src/styles.css) */
:root{
  --navy:#0b2545; --navy-light:#13355e; --accent:#00a8e8; --accent-text:#00729e; --green:#2e7d32; --red:#c62828; --amber:#e08e00; --amber-text:#8a5600;
  --bg:#f4f6f9; --card:#fff; --ink:#1a2332; --muted:#5b6b7f; --line:#dde3ea;
  --brand:var(--navy); --brand-2:var(--navy); --flag:#9a5b00; --flag-bg:#fff7e6; --err:var(--red); --radius:14px;
  --shadow:0 4px 18px rgba(11,37,69,.08);
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{flex:none;width:34px;height:34px;border-radius:9px;display:block}
header.top h1{font-size:1.1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
header.top h1 small{display:block;font-size:.72rem;font-weight:500;opacity:.75}
header.top button{min-height:34px;background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:4px 10px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
nav.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--navy-light);padding:8px 16px 10px;border-bottom:4px solid var(--accent)}
nav.tabs button{min-height:36px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);padding:4px 6px;font:inherit;font-weight:700;font-size:.92rem;background:transparent;color:#fff;cursor:pointer}
nav.tabs button.on{background:#fff;border-color:#fff;color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.sm{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
label{display:block;font-size:.85rem;font-weight:600;color:var(--ink);margin:12px 0 0}
input,select,textarea{width:100%;max-width:100%;min-width:0;font:inherit;font-size:16px;margin-top:4px;padding:6px 10px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input[type=date],input[type=time],input[type=month],input[type=week],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;line-height:1.2}input::-webkit-date-and-time-value{text-align:left;margin:0}input::-webkit-datetime-edit{padding:0}select{padding-right:28px;text-overflow:ellipsis}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{font-family:var(--mono);font-size:.95rem;line-height:1.55;min-height:46vh;resize:vertical;tab-size:2}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;border:1px solid var(--navy);border-radius:10px;padding:6px 14px;font:inherit;font-size:1rem;font-weight:700;background:var(--navy);color:#fff;margin-top:10px;cursor:pointer}
.btn.secondary{background:#fff;color:var(--navy);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.btnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.err{color:var(--red);margin-top:10px;font-size:.9rem}
.err:empty{display:none}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--navy)}
h3{font-size:.75rem;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-height:32px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chips.sm .chip{min-height:30px;padding:3px 9px;font-size:.8rem}
.chip:disabled{opacity:.45;cursor:default}
.chip.fx:not(.on){border-color:var(--accent)}
.chip .n{font-weight:600;opacity:.75}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap}
.tag.dist{background:var(--navy);border-color:var(--navy);color:#fff}
.tag.zone{background:#fff4e0;border-color:#f2d49b;color:#7a4d00}
.tag.skill{background:#e8f4fb;border-color:#b9dff2;color:var(--navy)}
.tag.author{background:#fff;color:var(--muted)}
.tag.none{background:#fdecea;border-color:#f3c2bd;color:var(--red)}
.tag.st-started{background:#fdebd0;border-color:#fdebd0;color:#7a4d00}
.tag.st-developing{background:#e3eef9;border-color:#e3eef9;color:var(--navy)}
.tag.st-embedded{background:#e3f2e5;border-color:#e3f2e5;color:var(--green)}
.tag.st-not-discussed{color:var(--muted)}
.flag{background:#fff7e6;border:1px solid #f3d9a4;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.flag b{color:var(--flag)}
.flag button{margin-left:auto;min-height:32px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:4px 10px;font:inherit;font-weight:700;font-size:.85rem;white-space:nowrap;cursor:pointer}
.flag.ok{opacity:.55}
.flag.done{background:#eef7ef;border-color:#cfe6d1}
.flag.done b{color:var(--green)}
.flag .acts{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.flag .acts button{margin-left:0}
.flag .explain{flex-basis:100%;margin-top:4px}
.flag.wrap{flex-wrap:wrap}
.flag .explain .btn{background:var(--navy);color:#fff;border-color:var(--navy);margin-left:0;white-space:normal}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;font-weight:500;color:var(--ink)}
.chk input{width:22px;height:22px;min-height:0;margin:0}
.rerun{position:sticky;bottom:12px;z-index:5;box-shadow:0 6px 18px rgba(11,37,69,.25)}
.gl{display:flex;gap:10px;align-items:flex-start}
.gl .del{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--red);border-radius:10px;padding:6px 10px;font:inherit;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:.85rem;color:var(--muted)}
.stats b{display:block;font-size:1.4rem;color:var(--navy)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.sec td{font-weight:700;background:var(--bg);color:var(--navy)}
.tbl tr.grp td{color:var(--accent-text);font-weight:700}
.tbl td.r{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.raw{white-space:pre-wrap;font-family:var(--mono);font-size:.85rem;background:var(--bg);border-radius:10px;padding:12px;margin:0}
.draft{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none!important}
/* plan laid out as written (Coach Tools plan view colours) */
.plan{font-size:1rem;line-height:1.4}
.plan .ph{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--navy);font-weight:800;font-size:1.05rem;color:var(--navy)}
.plan .ph:first-child{margin-top:0}
.plan .ph .rx{font-size:.8rem;font-weight:700;color:#fff;background:var(--accent-text);border-radius:99px;padding:1px 9px}
.plan .ph .pm{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.plan .ps{display:grid;grid-template-columns:4.6em 1fr auto;column-gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.plan .ps.in{padding-left:12px;grid-template-columns:4.1em 1fr auto;border-left:3px solid var(--accent)}
.plan .pa{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--navy)}
.plan .pd{min-width:0;overflow-wrap:anywhere}
.plan .pd.solo{grid-column:1 / 3}
.plan .po{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--navy);background:#e8f4fb;border:1px solid #b9dff2;border-radius:999px;padding:1px 8px;font-size:.85rem}
.plan .sub{margin-top:6px}
.plan .pd>.sub:first-child{margin-top:0}
.plan .sub div{display:flex;gap:8px;padding:2px 0;font-size:.95rem}
.plan .sub i{font-style:normal;font-weight:700;color:var(--muted);min-width:1.6em}
.plan .pn{padding:8px 0;color:var(--muted);font-style:italic}
.plan .gap{height:6px}
.plan .ps:last-child{border-bottom:0}
.sumrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.topbar .chip{background:transparent;border:0;color:var(--navy-light);padding:6px 0}
.pdfbtn{margin-left:auto;min-height:34px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
.pdfbtn:disabled{opacity:.55}
.planh{font-size:1.2rem;color:var(--navy);margin:0 0 4px;overflow-wrap:anywhere}
details.more{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0 0}
.card details.more, .result details.more{box-shadow:none}
details.more>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;color:var(--navy)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";color:var(--accent-text);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary .muted{font-weight:400;font-size:.85rem;margin-left:auto}
details.more>.in{padding:0 14px 14px}
/* write tab: date + squad, then three numbered layers (Coach Tools session writer) */
main.wide{max-width:760px}
.pick{position:sticky;top:var(--hh,56px);z-index:15;padding-top:10px;padding-bottom:10px}
.pick p{margin:6px 0 0}
.editing{border-color:var(--accent);background:#f5fbfe}
.editing .chip{margin-left:6px;min-height:30px}
.stack{display:grid;gap:14px}
.layer{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.layer>h2{margin:0;font-size:1rem}
.layer>h2 button{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 14px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:800;text-align:left;cursor:pointer}
.layer.shut>h2 button{background:#fff;color:var(--navy)}
.layer .ln{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:rgba(255,255,255,.2)}
.layer.shut .ln{background:var(--navy);color:#fff}
.layer .lt{flex:1;display:grid;min-width:0}
.layer .lnote{font-weight:500;font-size:.78rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .lnote:empty{display:none}
.layer .lc{flex:none;font-size:1.1rem}
.layer .lb{padding:12px 14px 14px}
.layer .lb.shut{display:none}
.cycles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cy{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:8px 10px;background:#fff}
.cy.macro{border-left-color:var(--navy)}.cy.meso{border-left-color:var(--accent)}.cy.micro{border-left-color:var(--green)}
.cy h4{margin:0 0 2px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cy p{margin:2px 0;overflow-wrap:anywhere}
.cy .note{font-size:.85rem;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
.sess{margin-top:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.9rem}
.sess p{margin:2px 0}.sess .when{font-weight:700}
.pre{white-space:pre-wrap}
.ev{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:.88rem}
.ev .tag{margin:0}
.ev .tag.comp{background:#fff4e0;border-color:#f2d49b;color:#7a4d00}
.ev .tag.test{background:#e8f4fb;border-color:#b9dff2;color:var(--navy)}
.warnbox{background:#fdf3e1;border:1px solid #f2d49b;color:var(--navy);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:.9rem}
.result{margin:12px 0 4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.result h3:first-of-type{margin-top:12px}
.fbhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;flex:1;min-width:220px}
.seg button{min-height:36px;padding:4px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fbl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.fbl li{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fbl p{margin:2px 0}
.fbt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fbt .tag{margin:0}
/* archive: Coach Tools plan list */
.filters h2{margin-bottom:0}
.agroup{margin:16px 0 8px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between}
.item{width:100%;text-align:left;display:block;margin-bottom:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:1rem;color:var(--navy);overflow-wrap:anywhere}
.item .m{font-size:.85rem;color:var(--muted);margin-top:2px}
.item .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.item .tags .tag{margin:0}
.item mark{background:#fff3b0;color:inherit;border-radius:3px;padding:0 1px}
.item .hit{font-size:.82rem;color:var(--muted);margin-top:6px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{margin:0 0 6px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){ .row3{grid-template-columns:1fr 1fr} .row3>div.full{grid-column:1 / -1} .cycles{grid-template-columns:1fr} }
@media (min-width:1100px){
  main.wide{max-width:1480px}
  .stack{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"pick pick" "write season" "write fb";column-gap:16px;align-items:start}
  .stack>.pick{grid-area:pick;position:static}
  #L1{grid-area:season}#L2{grid-area:fb}#L3{grid-area:write}
  .layer .lb.shut{display:block}
  .layer.shut>h2 button{background:var(--navy);color:#fff}
  .layer.shut .ln{background:rgba(255,255,255,.2)}
  .layer>h2 button{cursor:default}
  .layer .lc{display:none}
  #L2 .lb{max-height:60vh;overflow:auto}
}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="icon.svg" alt="">
  <h1><span id="title">Session Planner</span><small>Session Planner · Coach Tools</small></h1>
  <button id="outBtn" class="hide">Sign out</button>
</header>
<nav class="tabs hide" id="tabs"><button data-t="write" class="on">✍️ Write</button><button data-t="archive">🗂️ Archive</button><button data-t="shorthand">📖 Shorthand</button></nav>
<main id="app"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://nxlgeykipnvswyeshrbl.supabase.co";
const SUPABASE_KEY="sb_publishable_BYuKct-F0f4H04Gl_S58uQ_gKzuW_Ff";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const POOLS=["25m","17m","50m"];
const DRAFT="planner.draft.v2", ARCH="planner.archive.v1", LAYERS="planner.layers.v1";
/* Session focus = the Feedback Stroke/Skills list (as Coach Tools); primary focus = training zone. */
const FOCUS=["Free","Back","Breast","Fly","Dive","Transition","Touch turn","Tumble turn","Training mindset","Racing mindset"];
const CATL={Free:"Freestyle",Back:"Backstroke",Breast:"Breaststroke",Fly:"Butterfly"};
const catLabel=c=>CATL[c]||c||"";
const PRIMARY=["A1-3","Threshold","V02m","LT/LP","Sprint","Race pace","Technique","Recovery"];
const CAT_SKILL={Free:"FR",Back:"BK",Breast:"Brs",Fly:"Fly",Dive:"Start",Transition:"Trans.","Touch turn":"Turns","Tumble turn":"Turns"};
const QES={quality:"Quality",endurance:"Endurance",sprint:"Sprint"};
const S={ user:null, clubs:[], club:null, squads:[], tab:"write", season:null,
  w:{ id:null, squad_id:"", date:todayISO(), pool:"25m", slot:null, text:"", title:"", focus:[], primary:"", touched:false, ctx:null },
  result:null, analysedText:null, okFlags:{}, clar:[], clarDirty:false, drills:[], gloss:[],
  layers:Object.assign({season:true,feedback:false,write:true},load(LAYERS)||{}),
  fb:{tab:"swimmers",cat:"",embedded:false,key:"",sw:null,sq:null,err:""},
  archive:{ squad:"", month:"", author:"", plans:[] }, cols:{created_by:true,focus_categories:true} };

const $=s=>document.querySelector(s), app=$("#app");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function hm(t){return t?String(t).slice(0,5):"";}
function niceDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function monthKey(iso){return iso?iso.slice(0,7):"";}
function monthName(k){return new Date(k+"-15T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
function m(n){return n?Number(n).toLocaleString("en-GB")+" m":"—";}
function squadName(id){return S.squads.find(s=>s.id===id)?.name||"";}
function coachName(){const md=S.user?.user_metadata||{};return md.full_name||md.name||(S.user?.email||"").split("@")[0];}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch{return null;}}

/* ---------- auth ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data.session){S.user=data.session.user;await afterLogin();}else renderLogin();
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.user=null;renderLogin();}});
}
function renderLogin(msg){
  $("#tabs").classList.add("hide");$("#outBtn").classList.add("hide");$("#title").textContent="Sign in";
  app.innerHTML=`<div class="card"><h2>Coach sign in</h2><p class="muted">Use the same email and password as Coach Tools.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go">Sign in</button><div class="err" id="er">${esc(msg||"")}</div></div>`;
  $("#go").onclick=async()=>{
    $("#go").disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    $("#go").disabled=false; if(error){$("#er").textContent=error.message;return;}
    S.user=data.user; afterLogin();
  };
}
async function afterLogin(){
  app.innerHTML=`<p class="muted">Loading…</p>`;
  const {data:roles,error}=await sb.from("user_roles").select("role, club_id").eq("user_id",S.user.id);
  if(error){renderLogin(error.message);return;}
  const r=(roles||[]).filter(x=>!["parent","swimmer"].includes(x.role));
  if(!r.length){renderLogin("This account has no coach access.");return;}
  const {data:clubs}=await sb.from("clubs").select("id, name, short_name").order("name");
  const all=r.some(x=>!x.club_id);
  S.clubs=(clubs||[]).filter(c=>all||r.some(x=>x.club_id===c.id));
  S.club=S.clubs.find(c=>c.id===localStorage.getItem("planner.club"))||(S.clubs.length===1?S.clubs[0]:null);
  $("#outBtn").classList.remove("hide");
  S.club?enterClub():renderClubs();
}

/* ---------- write: date + squad, then 1. Season plan  2. Feedback to date  3. Write plan ----------
   Same model as the session writer in Coach Tools. On a phone the layers stack and
   fold; on a wide screen (≥1100px) write sits on the left, season plan top right and
   feedback bottom right. Date and squad control everything below them. */
function saveDraft(){ store(DRAFT,{club_id:S.club.id,w:{...S.w,ctx:null}}); const el=$("#drafted"); if(el) el.textContent="Draft kept on this device"; }
const isoAdd=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const ddmm=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const dayShort=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"";
const changed=()=>S.analysedText===null||S.analysedText.trim()!==S.w.text.trim();

/* Season plan for the club: seasons, macros (with their squads and weeks), competitions, breaks. Loaded once. */
async function loadSeason(){
  if(S.season&&S.season.club===S.club.id) return S.season;
  const out={club:S.club.id,seasons:[],macros:[],comps:[],breaks:[]};
  const {data:se}=await sb.from("seasons").select("id, title, start_date, finish_date").eq("club_id",S.club.id).eq("is_active",true);
  out.seasons=se||[]; const ids=out.seasons.map(s=>s.id);
  if(ids.length){
    const [mq,cq,bq]=await Promise.all([
      sb.from("macros").select("id, title, season_id, head_coach_note, macro_squads(squad_id, is_active), micros(id, week_no, week_commencing, meso, qes_focus, technical_focus, break_days, planned_volume_m, is_active)").in("season_id",ids).eq("is_active",true),
      sb.from("season_competitions").select("id, season_id, name, date_from, date_to").in("season_id",ids).eq("is_active",true),
      sb.from("season_breaks").select("season_id, break_start, break_end").in("season_id",ids).eq("is_active",true)]);
    out.macros=mq.data||[]; out.comps=cq.data||[]; out.breaks=bq.data||[];
  }
  return S.season=out;
}
/* The macro / meso / micro and session(s) for the chosen squad and date. */
async function loadCtx(){
  const w=S.w; w.ctx=null;
  if(!w.squad_id||!w.date) return;
  const sea=await loadSeason();
  let macro=null, micro=null;
  for(const ma of sea.macros){
    if(micro||!(ma.macro_squads||[]).some(x=>x.squad_id===w.squad_id&&x.is_active)) continue;
    const hit=(ma.micros||[]).find(mi=>mi.is_active&&mi.week_commencing&&mi.week_commencing<=w.date&&isoAdd(mi.week_commencing,6)>=w.date);
    if(hit){macro=ma;micro=hit;}
  }
  if(!micro) return;
  const weeks=(macro.micros||[]).filter(x=>x.is_active&&x.week_commencing).sort((a,b)=>a.week_commencing.localeCompare(b.week_commencing));
  const meso=micro.meso?weeks.filter(x=>x.meso===micro.meso):[];
  const idx=l=>Math.max(1,l.findIndex(x=>x.id===micro.id)+1), wc=micro.week_commencing;
  const [msq,wq,pq]=await Promise.all([
    sb.from("micro_sessions").select("id, start_time, end_time, stroke_focus, outline, timetable_session_id").eq("micro_id",micro.id).eq("squad_id",w.squad_id).eq("session_date",w.date).eq("is_active",true).order("start_time"),
    sb.from("season_windows").select("id, kind, title, starts_on, ends_on, squad_id, squad_ids").eq("season_id",macro.season_id).eq("is_active",true).lte("starts_on",isoAdd(w.date,14)).gte("ends_on",w.date).order("starts_on"),
    sb.from("session_plans").select("id, total_distance_m").eq("squad_id",w.squad_id).gte("intended_date",wc).lte("intended_date",isoAdd(wc,6))]);
  let tsPool={}; const tsIds=(msq.data||[]).map(x=>x.timetable_session_id).filter(Boolean);
  if(tsIds.length){const {data:ts}=await sb.from("timetable_sessions").select("id, pool_size").in("id",tsIds);(ts||[]).forEach(t=>tsPool[t.id]=t.pool_size);}
  const sessions=(msq.data||[]).map(x=>({id:x.id,start:hm(x.start_time),end:hm(x.end_time),pool:tsPool[x.timetable_session_id]||null,stroke_focus:x.stroke_focus,outline:x.outline}));
  if(w.slot&&!sessions.find(s=>s.id===w.slot)) w.slot=null;
  if(!w.slot&&sessions.length) w.slot=sessions[0].id;
  const session=sessions.find(s=>s.id===w.slot)||null;
  if(session&&session.pool&&!w.id) w.pool=session.pool;
  const plans=(pq.data||[]).filter(p=>p.id!==w.id);
  const dow=(()=>{const g=new Date(w.date+"T12:00:00").getDay();return g===0?7:g;})();
  const comps=sea.comps.filter(c=>c.season_id===macro.season_id).sort((a,b)=>a.date_from.localeCompare(b.date_from));
  w.ctx={ macro_id:macro.id, macro:macro.title, note:macro.head_coach_note, season:sea.seasons.find(s=>s.id===macro.season_id)?.title,
    micro_id:micro.id, week_no:micro.week_no, wc, meso:micro.meso, qes:micro.qes_focus, technical_focus:micro.technical_focus, planned_volume_m:micro.planned_volume_m,
    macroWeeks:weeks.length, weekInMacro:idx(weeks), macroFrom:weeks[0]?.week_commencing, macroTo:weeks.length?isoAdd(weeks[weeks.length-1].week_commencing,6):null,
    mesoWeeks:meso.length, weekInMeso:meso.length?idx(meso):0, mesoFrom:meso[0]?.week_commencing, mesoTo:meso.length?isoAdd(meso[meso.length-1].week_commencing,6):null,
    sessions, session, id:session?.id||null, stroke_focus:session?.stroke_focus, outline:session?.outline,
    plansWeek:plans.length, plannedWeek:plans.reduce((a,p)=>a+(p.total_distance_m||0),0),
    windows:(wq.data||[]).filter(x=>(!x.squad_id&&!(x.squad_ids||[]).length)||x.squad_id===w.squad_id||(x.squad_ids||[]).includes(w.squad_id)),
    comp:comps.find(c=>c.date_from>=isoAdd(wc,5)&&c.date_from<=isoAdd(wc,7))||null,
    nextComp:comps.find(c=>c.date_from>=w.date)||null,
    isBreak:(micro.break_days||[]).map(Number).includes(dow)||sea.breaks.some(b=>b.season_id===macro.season_id&&w.date>=b.break_start&&w.date<=b.break_end) };
  // Focus comes from the micro-cycle until the coach changes it.
  if(!w.touched){
    const t=(session?.stroke_focus||"").toLowerCase(), f=new Set();
    if(/\b(fr|free|freestyle|front ?crawl|crawl)\b/.test(t)) f.add("Free");
    if(/\b(bk|back|backstroke)\b/.test(t)) f.add("Back");
    if(/\b(br|brs|breast|breaststroke)\b/.test(t)) f.add("Breast");
    if(/\b(fly|butterfly)\b/.test(t)) f.add("Fly");
    if(/\b(start|starts|dive|dives)\b/.test(t)||Number(micro.technical_focus)===6) f.add("Dive");
    if(/transition|changeover/.test(t)) f.add("Transition");
    if(/tumble/.test(t)) f.add("Tumble turn"); else if(/touch/.test(t)) f.add("Touch turn");
    w.focus=FOCUS.filter(c=>f.has(c));
    w.primary=micro.qes_focus==="sprint"?"Sprint":micro.qes_focus==="endurance"?"A1-3":"";
  }
}

function layer(n,key,title,note,body){
  const open=S.layers[key];

    <div class="lb${open?"":" shut"}" id="LB${n}">${body}</div></section>`;
}
function seasonHtml(){

        ${(c.planned_volume_m||c.plansWeek)?`<p class="muted sm">${c.plansWeek} other plan${c.plansWeek===1?"":"s"} this week${c.plannedWeek?` · ${m(c.plannedWeek)}`:""}${c.planned_volume_m?` of ${m(c.planned_volume_m)} planned`:""}</p>`:""}</div>
    </div>
    ${c.sessions.length>1?`<label>Which session</label><div class="chips" id="slots">${c.sessions.map(s=>`<button type="button" class="chip ${s.id===w.slot?"on":""}" data-id="${s.id}">${s.start}${s.end?"–"+s.end:""}</button>`).join("")}</div>`:""}
    ${c.session?`<div class="sess"><p class="when">${esc(dayShort(w.date))}${c.session.start?` · ${c.session.start}${c.session.end?"–"+c.session.end:""}`:""}</p>
      ${c.stroke_focus?`<p>Stroke focus: <b>${esc(c.stroke_focus)}</b></p>`:""}${c.outline?`<p class="muted pre">${esc(c.outline)}</p>`:""}</div>`
      :`<p class="muted sm">No session outlined for this date in the micro-cycle.</p>`}
    ${c.windows.map(x=>`<p class="ev"><span class="tag test">${x.kind==="test_set"?"Test window":x.kind==="squad_move"?"Squad moves":esc(x.kind)}</span>${esc(x.title||"")} <span class="muted">${ddmm(x.starts_on)} – ${ddmm(x.ends_on)}</span></p>`).join("")}
    ${c.comp?`<p class="ev"><span class="tag comp">Competition this week</span>${esc(c.comp.name)} <span class="muted">${esc(dayShort(c.comp.date_from))}</span></p>`:""}
    ${c.nextComp&&c.nextComp.name!==c.comp?.name?`<p class="ev"><span class="tag comp">Next competition</span>${esc(c.nextComp.name)} <span class="muted">${esc(dayShort(c.nextComp.date_from))} · in ${Math.round((Date.parse(c.nextComp.date_from)-Date.parse(w.date))/864e5)} days</span></p>`:""}`;
}

async function renderWrite(){
  const w=S.w;
  if(!w.squad_id && S.squads.length===1) w.squad_id=S.squads[0].id;
  app.classList.add("wide");
  if(!$("#wstack")) app.innerHTML=`<p class="muted">Loading the season plan…</p>`;
  try{ await loadCtx(); }catch(e){ console.warn("season",e); }
  const c=w.ctx;
  app.innerHTML=`
    ${w.id?`<div class="card editing"><b>Editing a saved plan.</b> <span class="muted">Saving updates it.</span> <button class="chip" id="newPlan">Start a new plan</button></div>`:""}
    <div class="stack" id="wstack">
      <section class="card pick" aria-label="Date and squad">
        <div class="row2"><div><label for="dt" style="margin-top:0">Date</label><input id="dt" type="date" value="${w.date}"></div>

        <p class="muted sm" style="margin:8px 0 0">${w.squad_id?`${esc(squadName(w.squad_id))} · ${esc(dayShort(w.date))}`:"Choose the squad"} — sets the season plan, feedback and plan below.</p>
      </section>

      ${layer(2,"feedback","Feedback to date",w.focus.length?`Focus: ${w.focus.map(catLabel).join(", ")}`:"",`<div id="fbx"></div>`)}
      ${layer(3,"write","Write plan","",writeHtml())}
    </div>`;
  if(w.id) $("#newPlan").onclick=()=>{ Object.assign(S.w,{id:null,text:"",title:"",touched:false}); resetAnalysis(); saveDraft(); renderWrite(); };
  app.querySelectorAll(".layer h2 button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.l; S.layers[k]=!S.layers[k]; store(LAYERS,S.layers);
    b.setAttribute("aria-expanded",S.layers[k]); b.querySelector(".lc").textContent=S.layers[k]?"▾":"▸";

  app.querySelectorAll("#slots .chip").forEach(x=>x.onclick=()=>{w.slot=x.dataset.id;saveDraft();renderWrite();});
  $("#po").onchange=e=>{w.pool=e.target.value;saveDraft();};
  $("#pr").onchange=e=>{w.primary=e.target.value;w.touched=true;saveDraft();};
  app.querySelectorAll("#focus .chip").forEach(x=>x.onclick=()=>{
    const k=x.dataset.c; w.touched=true; w.focus=FOCUS.filter(f=>f===k?!w.focus.includes(k):w.focus.includes(f));

    $("#LN2").textContent=w.focus.length?`Focus: ${w.focus.map(catLabel).join(", ")}`:""; S.fb.cat=""; renderFb(); saveDraft();
  });
  let t; $("#tx").oninput=e=>{w.text=e.target.value;clearTimeout(t);t=setTimeout(saveDraft,500);markStale();};
  $("#ti").oninput=e=>{w.title=e.target.value;clearTimeout(t);t=setTimeout(saveDraft,500);};
  $("#go").onclick=()=>analyse($("#go"),$("#er"),"Analyse with AI");
  $("#go2").onclick=()=>analyse($("#go2"),$("#er"),"Analyse with AI");
  $("#save").onclick=savePlan;
  setHeaderHeight(); markStale(); renderResult(); loadFb();
}
function setHeaderHeight(){ document.documentElement.style.setProperty("--hh",(document.querySelector("header.top")?.offsetHeight||56)+"px"); }
window.addEventListener("resize",setHeaderHeight);
function resetAnalysis(){ S.result=null; S.analysedText=null; S.okFlags={}; S.clar=[]; S.clarDirty=false; }
function markStale(){
  const n=$("#LN3"); if(n) n.textContent=changed()?(S.w.text.trim()?"Not analysed yet":""):"Analysed ✓";
  const st=$("#stale"); if(st) st.classList.toggle("hide",!(S.result&&changed()));
}
async function analyse(go,er,label){
  const w=S.w;
  if(!w.squad_id){er.textContent="Choose a squad first.";return;}
  if(w.text.trim().length<5){er.textContent="Write the session first.";return;}
  er.textContent=""; go.disabled=true; go.innerHTML=`<span class="spin"></span>AI is reading your plan…`;
  const c=w.ctx||{};
  const chosen=[w.focus.length?`coach's chosen focus: ${w.focus.join(", ")}`:"",w.primary?`primary training focus: ${w.primary}`:""].filter(Boolean).join("; ");
  const sent=w.text;
  const {data,error}=await sb.functions.invoke("analyse-session-plan",{body:{
    text:sent, club_id:S.club.id, squad_name:squadName(w.squad_id), date:w.date, pool_size:w.pool,
    context:w.ctx?{meso:[c.macro,c.meso?`meso ${c.meso}`:"",`week ${c.week_no}`].filter(Boolean).join(", "),week_focus:[c.qes,chosen].filter(Boolean).join("; ")||undefined,stroke_focus:c.stroke_focus||undefined,outline:c.outline||undefined}:(chosen?{week_focus:chosen}:{}),
    clarifications:S.clar.map(x=>({term:x.term,meaning:x.meaning,drill_id:x.drill_id||null}))}});
  go.disabled=false; go.textContent=label;
  if(error||!data?.plan){
    let msg=error?.message||data?.error||"The AI didn't return a plan. Try again."; try{const j=await error.context.json(); if(j.error) msg=j.error;}catch{}
    er.textContent=msg; return;
  }
  S.result=data; S.analysedText=sent; S.okFlags={}; S.clarDirty=false;
  if(!w.title.trim()&&data.plan.title){ w.title=data.plan.title; const ti=$("#ti"); if(ti) ti.value=w.title; }
  if(!w.primary&&PRIMARY.includes(data.plan.training_zone)){ w.primary=data.plan.training_zone; const pr=$("#pr"); if(pr) pr.value=w.primary; }
  saveDraft(); markStale(); renderResult();
  $("#res")?.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- analysis (inside Write plan, under the text) ---------- */
function setLine(s){
  const bits=[]; if(s.reps&&s.distance_m) bits.push(`${s.reps} × ${s.distance_m}`); else if(s.distance_m) bits.push(`${s.distance_m}`);
  return bits.join(" ");
}
function setsTable(blocks){
  let rows="";
  const row=(s,indent)=>`<tr><td>${indent?"&nbsp;&nbsp;":""}${esc(s.text||"")}</td><td class="r">${esc(setLine(s))}</td><td>${esc(s.stroke||"")}</td><td>${esc(s.kind||"")}</td><td>${esc(s.interval_text||"")}</td><td>${esc(s.effort||"")}</td><td>${esc(s.drill_name||"")}${s.drill_id?" ✓":""}</td></tr>`;
  for(const b of blocks||[]){
    if(b.type==="heading") rows+=`<tr class="sec"><td colspan="7">${esc(b.text)}</td></tr>`;
    else if(b.type==="note") rows+=`<tr><td colspan="7" class="muted"><i>${esc(b.text)}</i></td></tr>`;

}
function breakdown(obj){
  const e=Object.entries(obj||{}).filter(([k,v])=>v).sort((a,b)=>b[1]-a[1]);

}

        <div class="acts"><button class="ex">Explain</button><button class="lr">Looks right</button></div><div class="explain hide"></div></div>`).join("")}`:""}
    <div id="rerunAt"></div>
    <details class="more"><summary>How it reads<span class="muted">your text, laid out</span></summary><div class="in">${planHtml(layoutPlan(S.analysedText,(p.blocks||[]).filter(b=>b.type==="heading").map(b=>b.text),totalsFromBlocks(p.blocks),(p.blocks||[]).filter(b=>b.type==="note").map(b=>b.text)))}</div></details>

/* ---------- feedback to date (latest entry of each feedback string up to the date) ---------- */
function latestFb(rows,emb){ const seen=new Set(), out=[]; for(const r of rows){ if(seen.has(r.thread_id)) continue; seen.add(r.thread_id); out.push(r);} return out.filter(r=>emb||r.status!=="Embedded"); }
async function loadFb(){
  const w=S.w, F=S.fb, key=`${w.squad_id}|${w.date}|${F.embedded}`;
  if(!w.squad_id){ F.key=""; F.sw=F.sq=null; renderFb(); return; }
  if(F.key===key&&F.sw){ renderFb(); return; }
  F.key=key; F.sw=F.sq=null; F.err=""; renderFb();
  try{
    const sw=await sb.from("swimmers").select("id, full_name").eq("squad_id",w.squad_id).eq("active",true);
    if(sw.error) throw sw.error;
    const names=new Map((sw.data||[]).map(s=>[s.id,s.full_name]));
    const [a,b]=await Promise.all([
      names.size?sb.from("swimmer_feedback").select("thread_id, swimmer_id, category, criterion, status, observation, remedial_action, note, session_date, created_at")
        .in("swimmer_id",[...names.keys()]).lte("session_date",w.date).order("session_date",{ascending:false}).order("created_at",{ascending:false}).limit(2000):Promise.resolve({data:[]}),
      sb.from("squad_feedback").select("thread_id, category, criterion, status, observation, remedial_action, note, session_date, created_at, drills_library(drill_name)")
        .eq("squad_id",w.squad_id).eq("is_active",true).lte("session_date",w.date).order("session_date",{ascending:false}).order("created_at",{ascending:false}).limit(500)]);
    if(a.error) throw a.error; if(b.error) throw b.error;
    if(F.key!==key) return;
    F.sw=latestFb(a.data||[],F.embedded).map(r=>({...r,who:names.get(r.swimmer_id)||"Swimmer"})).sort((x,y)=>x.who.localeCompare(y.who)||y.session_date.localeCompare(x.session_date));
    F.sq=latestFb(b.data||[],F.embedded).map(r=>({...r,who:"Squad",drill_name:r.drills_library?.drill_name||null}));
  }catch(e){ F.err=e.message||String(e); F.sw=F.sq=[]; }
  renderFb();
}
function renderFb(){
  const box=$("#fbx"); if(!box) return;
  const w=S.w, F=S.fb;
  if(!w.squad_id){ box.innerHTML=`<p class="muted">Choose a squad to see its feedback.</p>`; return; }
  if(!F.sw){ box.innerHTML=`<p class="muted">Loading feedback…</p>`; return; }
  const counts=new Map(); for(const r of F.sw) counts.set(r.category,(counts.get(r.category)||0)+1);
  const shown=F.cat||w.focus.find(c=>counts.get(c))||"";

    ${r.criterion?`<p class="sm"><b>${esc(r.criterion)}</b></p>`:""}${(r.observation||r.note)?`<p class="sm">${esc(r.observation||r.note)}</p>`:""}${r.remedial_action?`<p class="sm muted">→ ${esc(r.remedial_action)}</p>`:""}${r.drill_name?`<p class="sm"><span class="tag">${esc(r.drill_name)}</span></p>`:""}</li>`).join("")}</ul>`:"";
  const swRows=F.sw.filter(r=>!shown||r.category===shown);
  box.innerHTML=`${F.err?`<p class="err">Couldn't load all the feedback: ${esc(F.err)}</p>`:""}
    <div class="fbhead"><div class="seg"><button type="button" class="${F.tab==="swimmers"?"on":""}" data-t="swimmers">Swimmers (${F.sw.length})</button><button type="button" class="${F.tab==="squad"?"on":""}" data-t="squad">Squad (${F.sq.length})</button></div>

      ${list(swRows,false)||`<p class="muted">No current feedback${shown?` for ${esc(catLabel(shown))}`:""}.</p>`}`
      :(list(F.sq,true)||`<p class="muted">No current squad feedback.</p>`)}`;

/* ---------- save ---------- */
function toContent(blocks){
  const set=s=>({type:"set",text:s.text||"",drill_ids:s.drill_id?[s.drill_id]:[]});
  const out=[];
  for(const b of blocks||[]){
    if(b.type==="heading") out.push({type:"heading",text:b.text||"",bold:true,underline:true});
    else if(b.type==="note") out.push({type:"note",text:b.text||""});
    else if(b.type==="set"&&b.set) out.push(set(b.set));
    else if(b.type==="repeat_group"){ if(b.label) out.push({type:"note",text:b.label}); out.push({type:"repeat_group",reps:b.reps||1,children:(b.children||[]).map(set)}); }
  }
  return out;
}
function toSetRows(planId, blocks){
  const rows=[]; let section=null, n=0;
  const add=(s,grp)=>rows.push({ session_plan_id:planId, club_id:S.club.id, set_order:++n, section, group_label:grp?.label||null, group_reps:grp?.reps||1,
    reps:s.reps??null, distance_m:s.distance_m??null, total_m:(s.reps&&s.distance_m)?s.reps*s.distance_m*(grp?.reps||1):null,
    stroke:s.stroke||null, kind:s.kind||null, effort:s.effort||null, interval_text:s.interval_text||null, interval_s:s.interval_s??null,
    target_text:s.target_text||null, rest_s:s.rest_s??null, equipment:s.equipment?.length?s.equipment:null,
    drill_id:s.drill_id||null, drill_name:s.drill_name||null, description:s.text||null });
  for(const b of blocks||[]){
    if(b.type==="heading") section=b.text;
    else if(b.type==="set"&&b.set) add(b.set,null);
    else if(b.type==="repeat_group") (b.children||[]).forEach(c=>add(c,b));
  }
  return rows;
}
/* Write a row, leaving out any column this database doesn't have yet (created_by, focus_categories). */
async function writePlan(id,row){
  for(let i=0;i<3;i++){
    for(const k of Object.keys(S.cols)) if(!S.cols[k]) delete row[k];
    const res=id?await sb.from("session_plans").update(row).eq("id",id).select("id").single()
                :await sb.from("session_plans").insert(row).select("id").single();
    const miss=res.error&&Object.keys(S.cols).find(k=>S.cols[k]&&(res.error.message||"").includes(k));
    if(!miss) return res;
    S.cols[miss]=false;
  }
}

function openExplain(el,f,i,after){
  const box=el.querySelector(".explain"); if(!box.classList.contains("hide")){box.classList.add("hide");return;}
  const term=(f.term||"").trim(), prev=S.clar.find(c=>c.term.toLowerCase()===(term||f.text).toLowerCase());

  box.innerHTML=`<label>${term?`What does “${esc(term)}” mean?`:"Add the detail the AI needs"}</label>

    <label>Is it a drill from the library? (optional)</label><select class="dr">${drillOptions(prev?.drill_id)}</select>

/* ---------- plan laid out as written ----------
   Reads the coach's own text line by line and lays it out for reading:
   headings, then each set as  amount | what to do | send-off,
   with numbered parts "1) … 2) …" on their own indented lines.
   The analysis (totals, set-by-set rows) is only used to add section
   distances; the words shown are always the coach's own. */
const HEAD_RE=/^(warm[\s-]?up|w\/?u\b|pre[\s-]?(main\s+)?set|main(\s+set)?|set\s*\d*|swim[\s-]?down|s\/?d\b|cool[\s-]?down|kick(\s+set)?|pull(\s+set)?|drills?(\s+set)?|test(\s+set)?|sprints?(\s+set)?|race[\s-]?pace|recovery|skills?|starts?|turns?|finish(es)?|relays?|dives?|technique)\b/i;
const normKey=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
function splitSubs(s){
  // "Free as SA 50, swim 50, 2) Bk as SA 50" -> lead text + numbered parts
  const re=/(?:^|[\s,;]+)\(?((?:\d{1,2})|[a-h])\)\s*/gi, hits=[]; let mm;
  while((mm=re.exec(s))) hits.push({at:mm.index,end:re.lastIndex,label:mm[1]});
  if(!hits.length) return {lead:s.trim(),subs:[]};
  const lead=s.slice(0,hits[0].at).replace(/[\s,;:]+$/,"").trim();
  const subs=hits.map((h,i)=>({label:h.label+")",text:s.slice(h.end,i+1<hits.length?hits[i+1].at:s.length).replace(/[\s,;]+$/,"").trim()})).filter(x=>x.text);
  return {lead,subs};
}
function parseSetText(line){
  let s=line.trim().replace(/^[-•*]\s*/,""), amt="", send="";
  let a=s.match(/^(\d+)\s*[x×*]\s*(\d+)\s*m?\b/i);
  if(a){amt=`${a[1]} × ${a[2]}`; s=s.slice(a[0].length);}
  else if((a=s.match(/^(\d{2,4})\s*m?(?=[\s,]|$)/i))){amt=a[1]; s=s.slice(a[0].length);}
  const o=s.match(/(^|[\s,])(@\s*\d{1,2}[:.]\d{2}|@\s*\d+\s*(?:s|secs?|")?|on\s+(?:the\s+)?\d{1,2}[:.]\d{2}|r(?:est|i)\s*:?\s*\d+\s*(?:s|secs?|")?|\d+\s*(?:s|secs?)\s+rest)(?=[\s,]|$)/i);
  if(o){send=o[2].replace(/^@\s*/,"@").replace(/\s+/g," "); s=(s.slice(0,o.index)+" "+s.slice(o.index+o[0].length)).replace(/\s{2,}/g," ");}
  const {lead,subs}=splitSubs(s.replace(/^[\s,;:-]+/,""));
  return {amt,send,desc:lead,subs};
}
function layoutPlan(text, headings, totals, notes){
  const known=new Set((headings||[]).map(normKey)), noteSet=new Set((notes||[]).map(normKey)), items=[];
  for(const raw of String(text||"").replace(/\r/g,"").split("\n")){
    if(!raw.trim()){ if(items.length&&items[items.length-1].kind!=="gap") items.push({kind:"gap"}); continue; }
    const line=raw.trim(), indent=/^(\s{2,}|\t)/.test(raw)||/^[-•*]\s/.test(line);
    const rep=line.match(/\s*[x×]\s*(\d+)\s*:?\s*$/i), base=(rep?line.slice(0,rep.index):line).replace(/:\s*$/,"").trim();
    const startsNum=/^\d/.test(line);
    const isHead=!startsNum && !indent && (known.has(normKey(line))||known.has(normKey(base))||/:\s*$/.test(line)
      ||(HEAD_RE.test(base)&&!/\d{2,}/.test(base)&&base.length<=40));
    if(isHead){ items.push({kind:"head",text:base||line,reps:rep?+rep[1]:null,dist:(totals||{})[normKey(base)]||(totals||{})[normKey(line)]||null}); continue; }
    // "Swim down 200 choice" -> heading "Swim down" + set "200 choice"
    const hm2=!startsNum&&!indent&&line.match(HEAD_RE), rest=hm2?line.slice(hm2[0].length).replace(/^[\s:,-]+/,""):"";
    if(hm2&&/^\d/.test(rest)){ const k=normKey(hm2[0]); items.push({kind:"head",text:hm2[0].trim(),reps:null,dist:(totals||{})[k]||null}); items.push({kind:"set",indent:false,...parseSetText(rest)}); continue; }
    const p=parseSetText(line);
    if(noteSet.has(normKey(line)) || (!p.amt && !p.send && !p.subs.length && !startsNum && /^\(.*\)$|^(n\.?b\.?|note|target|aim)\b/i.test(line))) items.push({kind:"note",text:line});
    else items.push({kind:"set",indent,...p});
  }
  while(items.length&&items[items.length-1].kind==="gap") items.pop();
  return items;
}
function planHtml(items){
  return `<div class="plan">`+items.map(it=>{
    if(it.kind==="gap") return `<div class="gap"></div>`;
    if(it.kind==="note") return `<div class="pn">${esc(it.text)}</div>`;
    if(it.kind==="head") return `<div class="ph"><span>${esc(it.text)}</span>${it.reps?`<span class="rx">×${it.reps}</span>`:""}${it.dist?`<span class="pm">${m(it.dist)}</span>`:""}</div>`;
    const subs=it.subs.length?`<div class="sub">${it.subs.map(s=>`<div><i>${esc(s.label)}</i><span>${esc(s.text)}</span></div>`).join("")}</div>`:"";
    return `<div class="ps${it.indent?" in":""}">${it.amt?`<div class="pa">${esc(it.amt)}</div>`:""}<div class="pd${it.amt?"":" solo"}">${esc(it.desc)}${subs}</div><div>${it.send?`<span class="po">${esc(it.send)}</span>`:""}</div></div>`;
  }).join("")+`</div>`;
}
function totalsFromSets(sets){ const t={}; for(const s of sets||[]) if(s.section&&s.total_m){const k=normKey(s.section); t[k]=(t[k]||0)+s.total_m;} return t; }
function totalsFromBlocks(blocks){
  const t={}; let k=null; const d=s=>(s.reps||1)*(s.distance_m||0);
  for(const b of blocks||[]){
    if(b.type==="heading"){k=normKey(b.text);continue;}
    if(!k) continue;
    if(b.type==="set"&&b.set) t[k]=(t[k]||0)+d(b.set);
    else if(b.type==="repeat_group") t[k]=(t[k]||0)+(b.reps||1)*(b.children||[]).reduce((a,c)=>a+d(c),0);
  }
  for(const x in t) if(!t[x]) delete t[x];
  return t;
}

/* ---------- PDF (share sheet on a phone, download elsewhere) ---------- */
const JSPDF_URL="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
let jspdfP=null;
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  return jspdfP||(jspdfP=new Promise((ok,no)=>{const s=document.createElement("script");s.src=JSPDF_URL;s.onload=()=>ok(window.jspdf);s.onerror=()=>{jspdfP=null;no(new Error("Couldn't load the PDF tool. Check the signal and try again."));};document.head.appendChild(s);}));
}
function pdfSafe(s){return String(s??"").replace(/[−–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,"...").replace(/•/g,"-").replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g,"");}
function buildPlanPdf(p, items){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), L=15, R=W-15, BR=[11,37,69], GR=[0,114,158], MU=[91,107,127];
  let y=0;
  const band=()=>{ doc.setFillColor(...BR); doc.rect(0,0,W,28,"F"); doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.text(pdfSafe(doc.splitTextToSize(p.title||"Session plan",R-L)[0]),L,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
    doc.text(pdfSafe([squadName(p.squad_id),p.intended_date?niceDate(p.intended_date):"",p.pool_size,p.coach].filter(Boolean).join("  ·  ")),L,19);
    doc.setFont("helvetica","bold"); doc.text(pdfSafe(m(p.total_distance_m)),R,19,{align:"right"});
    if(p.session_focus||p.training_zone){doc.setFont("helvetica","normal");doc.text(pdfSafe("Focus: "+(p.session_focus||p.training_zone)),L,25);}
    doc.setTextColor(21,33,27); y=38; };
  const need=h=>{ if(y+h>H-16){ doc.addPage(); band(); } };
  band();
  const AX=L, DX=L+24, OXW=24, DW=R-OXW-DX-2;
  for(const it of items){
    if(it.kind==="gap"){ y+=2.5; continue; }
    if(it.kind==="head"){
      need(14); y+=3; doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...GR);
      const t=pdfSafe(it.text+(it.reps?`  x${it.reps}`:"")); doc.text(t,L,y);
      if(it.dist){doc.setFontSize(10.5);doc.setTextColor(...MU);doc.text(pdfSafe(m(it.dist)),R,y,{align:"right"});}
      y+=2; doc.setDrawColor(...GR); doc.setLineWidth(.5); doc.line(L,y,R,y); y+=6; doc.setTextColor(21,33,27); continue;
    }
    if(it.kind==="note"){ doc.setFont("helvetica","italic"); doc.setFontSize(10.5); doc.setTextColor(...MU);
      const ls=doc.splitTextToSize(pdfSafe(it.text),R-L); need(ls.length*5+2); doc.text(ls,L,y); y+=ls.length*5+2; doc.setTextColor(21,33,27); continue; }
    const ind=it.indent?5:0, dx=it.amt?DX+ind:L+ind, dw=it.amt?DW-ind:DW+(DX-L)-ind;
    doc.setFont("helvetica","normal"); doc.setFontSize(11.5);
    const lead=it.desc?doc.splitTextToSize(pdfSafe(it.desc),dw):[];
    doc.setFontSize(10.5);
    const subs=it.subs.map(s=>({label:pdfSafe(s.label),lines:doc.splitTextToSize(pdfSafe(s.text),dw-8)}));
    const h=Math.max(1,lead.length)*5.4+subs.reduce((a,s)=>a+s.lines.length*4.9,0)+(subs.length?1.5:0)+3;
    need(h);
    if(it.amt){doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.text(pdfSafe(it.amt).replace("×","x"),AX+ind,y);}
    if(it.send){doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...GR);doc.text(pdfSafe(it.send),R,y,{align:"right"});doc.setTextColor(21,33,27);}
    doc.setFont("helvetica","normal"); doc.setFontSize(11.5);
    if(lead.length){doc.text(lead,dx,y); y+=lead.length*5.4;} else y+=5.4;
    if(subs.length){ y+=lead.length?1.5:-5.4; doc.setFontSize(10.5);
      for(const s of subs){ doc.setFont("helvetica","bold");doc.setTextColor(...MU);doc.text(s.label,dx,y);doc.setTextColor(21,33,27);
        doc.setFont("helvetica","normal");doc.text(s.lines,dx+8,y); y+=s.lines.length*4.9; } }
    doc.setDrawColor(220,227,222); doc.setLineWidth(.2); doc.line(L,y-2.4,R,y-2.4); y+=3.2;
  }
  const bits=Object.entries(p.distance_by_stroke||{}).filter(([k,v])=>v).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${m(v)}`);
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MU);
    if(i===pages&&bits.length) doc.text(pdfSafe("By stroke: "+bits.join(" · ")),L,H-10);
    doc.text(`Page ${i} of ${pages}`,R,H-10,{align:"right"}); }
  return doc;
}
async function sharePlanPdf(p, items, btn){
  const label=btn.textContent; btn.disabled=true; btn.textContent="Making PDF…";
  try{
    if(!window.jspdf) await loadJsPDF();
    const doc=buildPlanPdf(p,items);
    const name=pdfSafe(`${p.title||"Session plan"} ${p.intended_date||""}`).replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g," ").trim()+".pdf";
    const blob=doc.output("blob"), file=new File([blob],name,{type:"application/pdf"});
    let shared=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:p.title||"Session plan"}); shared=true; }
      catch(e){ if(e.name==="AbortError") shared=true; }
    }
    if(!shared){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); }
  }catch(e){ alert(e.message||String(e)); }
  finally{ btn.disabled=false; btn.textContent=label; }
}

const ARCH_COLS="id, title, intended_date, squad_id, session_focus, training_zone, stroke_skills, total_distance_m, pool_size, source, coach, raw_text, content";
async function loadArchive(){
  app.innerHTML=`<p class="muted">Loading plans…</p>`;

    .or(`club_id.eq.${S.club.id}`+(S.squads.length?`,squad_id.in.(${S.squads.map(s=>s.id).join(",")})`:""))
    .order("intended_date",{ascending:false,nullsFirst:false}).order("updated_at",{ascending:false}).limit(5000);

/* Each plan's author: the coach user who wrote it (or, for older plans, the name it was saved with). */
const authorKey=p=>p.created_by||(p.coach?"name:"+p.coach.trim().toLowerCase():"");
function authors(plans){
  const map=new Map();

const hl=(s,t)=>{ if(!t) return esc(s); const i=s.toLowerCase().indexOf(t); return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+t.length))+"</mark>"+esc(s.slice(i+t.length)); };

function contentToText(content){
  const out=[];
  for(const b of content||[]){
    if(b.type==="heading") out.push((out.length?"\n":"")+b.text);
    else if(b.type==="note"||b.type==="set") out.push(b.text);
    else if(b.type==="repeat_group"){ out.push(`${b.reps||1} rounds of:`); (b.children||[]).forEach(c=>out.push("  "+c.text)); }
  }
  return out.join("\n");
}

  $("#pdf").onclick=e=>sharePlanPdf(p,items,e.currentTarget);
  const loadInto=(keepId)=>{
    Object.assign(S.w,{ id:keepId?p.id:null, squad_id:p.squad_id||"", date:keepId?p.intended_date:todayISO(), pool:p.pool_size||"25m",
      slot:keepId?p.micro_session_id:null, text, title:keepId?(p.title||""):"",
      focus:(p.focus_categories||[]).filter(c=>FOCUS.includes(c)), primary:PRIMARY.includes(p.training_zone)?p.training_zone:"", touched:true });
    resetAnalysis(); S.layers.write=true; store(LAYERS,S.layers); saveDraft(); showTab("write");
  };
  $("#edit").onclick=()=>loadInto(true); $("#copy").onclick=()=>loadInto(false);
  window.scrollTo(0,0);
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
