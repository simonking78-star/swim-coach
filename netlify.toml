# scripts/build-web.sh assembles site/:
#   /          the React app (web/)
# The classic app (/classic/) was retired at Phase 6 of the club & squad
# normalisation; its links redirect to the root.
# See claude/specs/react-rewrite-scope.md.
# In deploy-preview and branch-deploy contexts build-web.sh points the
# React app at the staging Supabase project (A-018).

[build]
  base = "/"
  publish = "site"
  command = "bash scripts/build-web.sh"
  # Skip the Coach Tools deploy when a commit only touches apps/
  # (the session planner and swipe register have their own sites).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)apps'"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "bash scripts/build-web.sh"

[context.branch-deploy]
  command = "bash scripts/build-web.sh"

# Old links and bookmarks to the /v2 preview go to the same screen at the root.
[[redirects]]
  from = "/v2/*"
  to = "/:splat"
  status = 301

# The classic app was retired (Phase 6): old /classic/ links open the React app.
[[redirects]]
  from = "/classic/*"
  to = "/"
  status = 301
  force = true

# React Router: any path that isn't a real file loads the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
